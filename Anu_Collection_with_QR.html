<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu Collection - Payment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            color: #ccc;
        }

        .payment-box {
            max-width: 450px;
            margin: 35px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .qr-section {
            text-align: center;
            margin: 25px 0 10px;
        }

        .qr-section h3 {
            margin: 0 0 12px;
        }

        .qr-section img {
            display: block;
            width: 230px;
            height: 230px;
            object-fit: contain;
            margin: 0 auto;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .qr-section p {
            margin: 10px 0 0;
            color: #777;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .note {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
